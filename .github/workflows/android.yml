name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch_navigation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply verified navigation hardening
        run: |
          python3 <<'PY'
          from pathlib import Path

          map_path = Path('app/src/main/java/ai/drivemate/MapActivity.java')
          text = map_path.read_text(encoding='utf-8')

          field_marker = '    private boolean gpsWarningActive;'
          field = '''    /** True only while the user explicitly chose to open Android Location Settings. */
          private boolean waitingForLocationSettings;'''
          if 'private boolean waitingForLocationSettings;' not in text:
              if field_marker not in text:
                  raise SystemExit('Location field anchor not found; refusing to modify MapActivity.java')
              text = text.replace(field_marker, field_marker + '\n' + field, 1)

          old_focus = '''        if (!isLocationEnabled()) {
            Toast.makeText(this, "مکان گوشی خاموش است. آن را روشن کنید.", Toast.LENGTH_LONG).show();
            startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS));
            return;
        }'''
          new_focus = '''        if (!isLocationEnabled()) {
            if (!waitingForLocationSettings) {
                new AlertDialog.Builder(this)
                        .setTitle("موقعیت مکانی خاموش است")
                        .setMessage("برای نمایش موقعیت شما روی نقشه، ابتدا Location گوشی را فعال کنید.")
                        .setNegativeButton("انصراف", null)
                        .setPositiveButton("فعال کردن", (dialog, which) -> {
                            waitingForLocationSettings = true;
                            startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS));
                        })
                        .show();
            }
            return;
        }'''
          if old_focus in text:
              text = text.replace(old_focus, new_focus, 1)
          elif new_focus not in text:
              raise SystemExit('Location Settings block not found; refusing to modify MapActivity.java')

          resume_anchor = '''    @Override protected void onResume() {
        super.onResume();'''
          resume_new = '''    @Override protected void onResume() {
        super.onResume();
        if (waitingForLocationSettings) {
            waitingForLocationSettings = false;
            if (isLocationEnabled() && hasLocationPermission()) {
                Location restored = bestKnownDeviceLocation();
                if (restored != null) {
                    Location accepted = mapLocationFilter.filter(restored);
                    if (accepted != null) {
                        lastAcceptedMapLocation = new Location(accepted);
                        originLatitude = accepted.getLatitude();
                        originLongitude = accepted.getLongitude();
                        showCurrentMarker();
                        if (navigationMode && navigationCameraEnabled) updateNavigationCamera();
                        else if (map != null) {
                            map.moveCamera(new LatLng(originLatitude, originLongitude), 0.25f);
                            map.setZoom(15f, 0.25f);
                        }
                    }
                }
            }
        }'''
          if 'if (waitingForLocationSettings)' not in text:
              if resume_anchor not in text:
                  raise SystemExit('onResume anchor not found; refusing to modify MapActivity.java')
              text = text.replace(resume_anchor, resume_new, 1)

          map_path.write_text(text, encoding='utf-8')

          nav_path = Path('app/src/main/java/ai/drivemate/routing/NavigationEngine.java')
          nav = nav_path.read_text(encoding='utf-8')
          old_announce = 'float announceDistance = Math.max(35f, Math.min(220f, target.distanceMeters * 0.6f));'
          old_next = 'float nextAnnounceDistance = Math.max(35f, Math.min(220f, next.distanceMeters * 0.6f));'
          if old_announce in nav:
              nav = nav.replace(old_announce, 'float announceDistance = dynamicAnnouncementDistance(location, target);', 1)
          elif 'float announceDistance = dynamicAnnouncementDistance(location, target);' not in nav:
              raise SystemExit('Primary announcement-distance anchor not found; refusing to modify NavigationEngine.java')
          if old_next in nav:
              nav = nav.replace(old_next, 'float nextAnnounceDistance = dynamicAnnouncementDistance(location, next);', 1)
          elif 'float nextAnnounceDistance = dynamicAnnouncementDistance(location, next);' not in nav:
              raise SystemExit('Next announcement-distance anchor not found; refusing to modify NavigationEngine.java')

          helper_marker = '    /** True when the current step is a maneuver rather than a destination-only fallback step. */'
          helper = '''    /**
     * Computes a speed-aware warning distance instead of using one fixed distance for every car.
     * The base is approximately three seconds of reaction time plus a maneuver-specific buffer;
     * the step's own length is used as a route-scale hint, and the final value is bounded so a
     * slow car does not announce excessively early while a fast car still gets meaningful lead time.
     */
    private float dynamicAnnouncementDistance(Location location, RouteStep step) {
        float speedMps = 13.9f; // ~50 km/h when no reliable speed is available.
        if (location != null && location.hasSpeed() && location.getSpeed() >= 0f && location.getSpeed() < 70f) {
            speedMps = location.getSpeed();
        }
        String instruction = step == null || step.instruction == null
                ? "" : step.instruction.toLowerCase(java.util.Locale.ROOT);
        float maneuverBuffer = 35f;
        if (instruction.contains("u-turn") || instruction.contains("u turn")
                || instruction.contains("دوربرگردان") || instruction.contains("دور برگردان")) {
            maneuverBuffer = 70f;
        } else if (instruction.contains("roundabout") || instruction.contains("میدان")
                || instruction.contains("فلکه")) {
            maneuverBuffer = 60f;
        } else if (instruction.contains("left") || instruction.contains("right")
                || instruction.contains("چپ") || instruction.contains("راست")) {
            maneuverBuffer = 45f;
        }
        float timeBasedDistance = speedMps * 3.0f + maneuverBuffer;
        float routeHint = step == null ? 0f : Math.max(0f, step.distanceMeters * 0.35f);
        return Math.max(55f, Math.min(450f, Math.max(timeBasedDistance, routeHint)));
    }

'''
          if 'private float dynamicAnnouncementDistance(Location location, RouteStep step)' not in nav:
              if helper_marker not in nav:
                  raise SystemExit('NavigationEngine helper anchor not found; refusing to modify NavigationEngine.java')
              nav = nav.replace(helper_marker, helper + helper_marker, 1)
          nav_path.write_text(nav, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo 'Navigation hardening already present; nothing to commit.'
            exit 0
          fi
          git diff --check
          git config user.name "DriveMate AI"
          git config user.email "ghadir.baraty@gmail.com"
          git add app/src/main/java/ai/drivemate/MapActivity.java app/src/main/java/ai/drivemate/routing/NavigationEngine.java
          git commit -m "fix: harden location settings UX and speed-aware navigation alerts"
          git push

  build:
    needs: patch_navigation
    if: always() && (github.event_name == 'pull_request' || needs.patch_navigation.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          KEYS_DECRYPTION_SECRET: ${{ secrets.KEYS_DECRYPTION_SECRET }}
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    needs: patch_navigation
    if: always() && github.event_name != 'pull_request' && needs.patch_navigation.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.jks
      - name: Build signed Release APK and AAB
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          KEYS_DECRYPTION_SECRET: ${{ secrets.KEYS_DECRYPTION_SECRET }}
          RELEASE_STORE_FILE: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-AI-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Upload signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-AI-release-aab
          path: app/build/outputs/bundle/release/*.aab
