name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply navigation hardening before build
        if: github.event_name == 'pull_request'
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/ai/drivemate/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('        promptEnableLocationIfNeeded();\n', '')
          old = '''            long now = System.currentTimeMillis();
            while (!pendingDrivingAnnouncements.isEmpty()) {
                DrivingAnnouncement pending = pendingDrivingAnnouncements.pollFirst();
                if (pending != null && pending.expiresAt >= now) playDrivingAnnouncement(pending);
            }
            return;'''
          new = '''            long now = System.currentTimeMillis();
            while (!pendingDrivingAnnouncements.isEmpty()) {
                DrivingAnnouncement pending = pendingDrivingAnnouncements.pollFirst();
                if (pending != null && pending.expiresAt >= now) {
                    playDrivingAnnouncement(pending);
                    break;
                }
            }
            return;'''
          if old not in s: raise SystemExit('voice queue block not found')
          s = s.replace(old, new, 1)
          old = '''    protected void onResume() {
        super.onResume();
        maybeShowPendingTripReport();
        if (NightModeManager.refreshIfChanged(this)) return;
        NightModeManager.applyWindowBrightness(this);
    }'''
          new = '''    protected void onResume() {
        super.onResume();
        maybeShowPendingTripReport();
        if (pendingNavigationDestination != null && locationTracker != null
                && locationTracker.isLocationEnabled()) {
            SavedPlace destination = pendingNavigationDestination;
            List<RoutePoint> waypoints = pendingNavigationWaypoints == null
                    ? new ArrayList<>() : new ArrayList<>(pendingNavigationWaypoints);
            pendingNavigationDestination = null;
            pendingNavigationWaypoints = null;
            startNavigation(destination, waypoints, false);
        }
        if (NightModeManager.refreshIfChanged(this)) return;
        NightModeManager.applyWindowBrightness(this);
    }'''
          if old not in s: raise SystemExit('onResume block not found')
          s = s.replace(old, new, 1)
          old = '''                .setMessage("برای مسیریابی به \\\"" + destination.name + "\\\" باید مکان/GPS گوشی روشن باشد. "
                        + "به محض روشن شدن، مسیریابی به‌طور خودکار شروع می‌شود.")
                .setPositiveButton("روشن کردن GPS", (d, w) -> startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)))'''
          new = '''                .setMessage("برای مسیریابی به \\\"" + destination.name + "\\\" باید مکان گوشی روشن باشد. "
                        + "با زدن «فعال کردن موقعیت»، تنظیمات استاندارد Android باز می‌شود. "
                        + "بعد از روشن کردن موقعیت و بازگشت به برنامه، مسیریابی خودکار ادامه پیدا می‌کند.")
                .setPositiveButton("فعال کردن موقعیت", (d, w) -> startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)))'''
          if old not in s: raise SystemExit('location dialog block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          t = Path('app/src/test/java/ai/drivemate/traffic/TrafficIncidentProviderContractTest.java')
          t.parent.mkdir(parents=True, exist_ok=True)
          t.write_text('''package ai.drivemate.traffic;\n\nimport org.junit.Test;\nimport static org.junit.Assert.*;\n\npublic class TrafficIncidentProviderContractTest {\n    @Test public void providerDoesNotRequireAnApiKey() {\n        TrafficIncidentProvider provider = new TrafficIncidentProvider(\"\");\n        assertTrue(provider.hasKey());\n        provider.setApiKey(\"ignored\");\n        provider.setEnabled(false);\n        assertTrue(provider.hasKey());\n    }\n}\n''', encoding='utf-8')
          Path('.github/workflows/apply-route-features-v2.yml').unlink(missing_ok=True)
          import subprocess
          subprocess.run(['git','diff','--check'], check=True)
          subprocess.run(['git','config','user.name','DriveMate AI'], check=True)
          subprocess.run(['git','config','user.email','ghadir.baraty@gmail.com'], check=True)
          subprocess.run(['git','add','app/src/main/java/ai/drivemate/MainActivity.java','app/src/test/java/ai/drivemate/traffic/TrafficIncidentProviderContractTest.java','.github/workflows/apply-route-features-v2.yml'], check=True)
          subprocess.run(['git','commit','-m','fix: harden navigation voice and location UX [navigation-final]'], check=True)
          subprocess.run(['git','push','origin','HEAD:' + '${{ github.event.pull_request.head.ref }}'], check=True)

      - name: Build debug APK
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          KEYS_DECRYPTION_SECRET: ${{ secrets.KEYS_DECRYPTION_SECRET }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Build signed Release APK and AAB
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          KEYS_DECRYPTION_SECRET: ${{ secrets.KEYS_DECRYPTION_SECRET }}
          RELEASE_STORE_FILE: release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-AI-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DriveMate-AI-release-aab
          path: app/build/outputs/bundle/release/*.aab
