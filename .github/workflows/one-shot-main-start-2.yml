name: one-shot main navigation start repair 2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[main-start-repair-2]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: python3 tools/patch_main_navigation_start.py
      - name: Commit
        run: |
          git config user.name "DriveMate AI"
          git config user.email "ghadir.baraty@gmail.com"
          git add app/src/main/java/ai/drivemate/MainActivity.java
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: start main navigation foreground session [main-start-repair-2]"
          git push
