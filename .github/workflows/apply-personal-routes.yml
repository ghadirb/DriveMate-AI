name: Apply personal routes and trip map

on:
  push:
    branches: [ feature/personal-routes-and-trip-maps ]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip personal-route]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply implementation
        run: python3 tools/apply_personal_routes.py
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ai/drivemate/MainActivity.java app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Complete personal routes and trip map UI [skip personal-route]"
          git push
