name: One-shot navigation hardening

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[one-shot-navigation-fixes]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch navigation UX and timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          map_path = Path('app/src/main/java/ai/drivemate/MapActivity.java')
          text = map_path.read_text(encoding='utf-8')

          marker = 'private boolean gpsWarningActive;'
          if 'private boolean waitingForLocationSettings;' not in text:
              text = text.replace(marker, marker + '\n    /** True only while the user explicitly chose to open Android Location Settings. */\n    private boolean waitingForLocationSettings;')

          old = '''if (!isLocationEnabled()) {
            Toast.makeText(this, "مکان گوشی خاموش است. آن را روشن کنید.", Toast.LENGTH_LONG).show();
            startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS));
            return;
        }'''
          new = '''if (!isLocationEnabled()) {
            if (!waitingForLocationSettings) {
                new AlertDialog.Builder(this)
                        .setTitle("موقعیت مکانی خاموش است")
                        .setMessage("برای نمایش موقعیت شما روی نقشه، ابتدا Location گوشی را فعال کنید.")
                        .setNegativeButton("انصراف", null)
                        .setPositiveButton("فعال کردن", (dialog, which) -> {
                            waitingForLocationSettings = true;
                            startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS));
                        })
                        .show();
            }
            return;
        }'''
          if old not in text:
              raise SystemExit('location settings block not found')
          text = text.replace(old, new, 1)

          resume_anchor = '''@Override protected void onResume() {
        super.onResume();'''
          resume_insert = '''@Override protected void onResume() {
        super.onResume();
        if (waitingForLocationSettings) {
            waitingForLocationSettings = false;
            if (isLocationEnabled() && hasLocationPermission()) {
                Location restored = bestKnownDeviceLocation();
                if (restored != null) onLocationChanged(restored);
            }
        }'''
          if resume_anchor not in text:
              raise SystemExit('onResume anchor not found')
          text = text.replace(resume_anchor, resume_insert, 1)
          map_path.write_text(text, encoding='utf-8')

          nav_path = Path('app/src/main/java/ai/drivemate/routing/NavigationEngine.java')
          nav = nav_path.read_text(encoding='utf-8')
          old1 = '''float announceDistance = Math.max(35f, Math.min(220f, target.distanceMeters * 0.6f));'''
          new1 = '''float announceDistance = dynamicAnnouncementDistance(location, target);'''
          if old1 not in nav:
              raise SystemExit('first announcement distance not found')
          nav = nav.replace(old1, new1, 1)
          old2 = '''float nextAnnounceDistance = Math.max(35f, Math.min(220f, next.distanceMeters * 0.6f));'''
          new2 = '''float nextAnnounceDistance = dynamicAnnouncementDistance(location, next);'''
          if old2 not in nav:
              raise SystemExit('next announcement distance not found')
          nav = nav.replace(old2, new2, 1)
          helper = '''
    /**
     * Computes an approach warning from current speed and maneuver complexity instead of using a
     * fixed route-step fraction. At higher speed the driver gets more distance/time to react;
     * sharp turns, U-turns and roundabouts receive a modest extra buffer.
     */
    private float dynamicAnnouncementDistance(Location location, RouteStep step) {
        float speedMps = 13.9f; // conservative fallback: 50 km/h when speed is unavailable
        if (location != null && location.hasSpeed() && location.getSpeed() >= 0f && location.getSpeed() < 70f) {
            speedMps = location.getSpeed();
        }
        String instruction = step == null || step.instruction == null
                ? "" : step.instruction.toLowerCase(java.util.Locale.ROOT);
        float maneuverBuffer = 35f;
        if (instruction.contains("u-turn") || instruction.contains("دور برگردان") || instruction.contains("دور بزن")) {
            maneuverBuffer = 70f;
        } else if (instruction.contains("roundabout") || instruction.contains("میدان")) {
            maneuverBuffer = 60f;
        } else if (instruction.contains("left") || instruction.contains("right")
                || instruction.contains("چپ") || instruction.contains("راست")) {
            maneuverBuffer = 45f;
        }
        float reactionSeconds = 3.0f;
        float distance = speedMps * reactionSeconds + maneuverBuffer;
        float routeHint = step == null ? 0f : Math.max(0f, step.distanceMeters * 0.35f);
        return Math.max(55f, Math.min(450f, Math.max(distance, routeHint)));
    }
'''
          anchor = '''    /** True when the current step is a maneuver rather than a destination-only fallback step. */'''
          if 'private float dynamicAnnouncementDistance(Location location, RouteStep step)' not in nav:
              if anchor not in nav:
                  raise SystemExit('NavigationEngine helper anchor not found')
              nav = nav.replace(anchor, helper + '\n' + anchor, 1)
          nav_path.write_text(nav, encoding='utf-8')
          PY
          git config user.name "DriveMate AI"
          git config user.email "ghadir.baraty@gmail.com"
          git add app/src/main/java/ai/drivemate/MapActivity.java app/src/main/java/ai/drivemate/routing/NavigationEngine.java
          git commit -m "fix: harden location settings UX and speed-aware navigation alerts [one-shot-navigation-fixes]"
          git push
