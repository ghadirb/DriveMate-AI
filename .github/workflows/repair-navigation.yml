name: Apply navigation fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch NavigationEngine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ai/drivemate/routing/NavigationEngine.java')
          s = p.read_text(encoding='utf-8')

          old = 'private static final float FINAL_ARRIVAL_RADIUS_METERS = 55f;'
          new = 'private static final float FINAL_ARRIVAL_RADIUS_METERS = 100f;'
          if old not in s:
              raise SystemExit('arrival constant not found')
          s = s.replace(old, new, 1)

          marker = '        advancePastPassedSteps(location, routeProgress);\n        RouteStep target = route.steps.get(Math.min(nextStep, route.steps.size() - 1));'
          replacement = '''        advancePastPassedSteps(location, routeProgress);\n\n        // Mock GPS can jump over several maneuver endpoints between two updates.\n        // If a later actionable step is substantially closer than the current target,\n        // catch up to that step instead of keeping the engine stuck on the old turn.\n        if (routeProgress != null && routeProgress.onRoute && nextStep < route.steps.size() - 1) {\n            RouteStep currentTarget = route.steps.get(nextStep);\n            float currentDistance = location.distanceTo(asLocation(currentTarget));\n            int bestStep = nextStep;\n            float bestDistance = currentDistance;\n            int limit = Math.min(route.steps.size(), nextStep + 5);\n            for (int candidate = nextStep + 1; candidate < limit; candidate++) {\n                RouteStep later = route.steps.get(candidate);\n                if (later.waypointOrdinal >= 0) continue;\n                float d = location.distanceTo(asLocation(later));\n                if (d < bestDistance) {\n                    bestDistance = d;\n                    bestStep = candidate;\n                }\n            }\n            if (bestStep > nextStep && bestDistance <= 100f\n                    && currentDistance - bestDistance >= 80f) {\n                nextStep = bestStep;\n                currentInstructionAnnounced = false;\n                advanceConfirmSamples = 0;\n                updateTargetReference(location);\n            }\n        }\n\n        RouteStep target = route.steps.get(Math.min(nextStep, route.steps.size() - 1));'''
          if marker not in s:
              raise SystemExit('navigation insertion marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit navigation fixes and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ai/drivemate/routing/NavigationEngine.java .github/workflows/repair-navigation.yml
          git rm .github/workflows/repair-navigation.yml
          git commit -m 'fix: handle mock GPS route jumps and arrival radius'
          git push origin HEAD:main
