name: Apply navigation fixes

on:
  push:
    branches:
      - fix/navigation-robustness-2026-08-14

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply repair script
        run: python3 scripts/repair_navigation_2026_08_14.py
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Commit fixes and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ai/drivemate/routing/NavigationEngine.java app/src/main/java/ai/drivemate/routing/MapIrRoutingProvider.java app/src/main/java/ai/drivemate/routing/NeshanRoutingProvider.java app/src/main/java/ai/drivemate/routing/TomTomRoutingProvider.java app/src/main/java/ai/drivemate/MainActivity.java app/src/main/java/ai/drivemate/ai/OnlineSpeechClient.java
          git rm scripts/repair_navigation_2026_08_14.py .github/workflows/one-time-navigation-fix-2026-08-14.yml .github/workflows/repair-navigation.yml
          git commit -m 'fix: harden navigation, roundabouts and voice queue'
          git push origin HEAD:fix/navigation-robustness-2026-08-14
