name: Archived one-shot MapActivity compile repair

# Historical one-shot repair. Android Build is the only push-triggered CI workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create repair branch
        id: branch
        run: |
          BRANCH="repair/mapactivity-compile-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Apply exact compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ai/drivemate/MapActivity.java')
          s = p.read_text(encoding='utf-8')
          old = '    private boolean navigationMode;\n'
          new = old + '    private int displayedStepIndex = 0;\n'
          if s.count('displayedStepIndex') == 0:
              if s.count(old) != 1:
                  raise SystemExit('navigationMode anchor is not unique')
              s = s.replace(old, new, 1)
          elif 'private int displayedStepIndex = 0;' not in s:
              raise SystemExit('displayedStepIndex exists but declaration is missing')
          if 'first.laneGuidance' in s:
              s = s.replace('first.laneGuidance', 'first.lanes')
          if 'first.laneGuidance' in s:
              raise SystemExit('laneGuidance replacement failed')
          p.write_text(s, encoding='utf-8')
          PY
          grep -n "displayedStepIndex\|first\.lanes\|first\.laneGuidance" app/src/main/java/ai/drivemate/MapActivity.java

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK before publishing repair branch
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          KEYS_DECRYPTION_SECRET: ${{ secrets.KEYS_DECRYPTION_SECRET }}
        run: gradle assembleDebug --stacktrace

      - name: Push repair branch
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          git config user.name 'DriveMate AI'
          git config user.email 'ghadir.baraty@gmail.com'
          git add app/src/main/java/ai/drivemate/MapActivity.java
          git diff --cached --check
          git commit -m 'fix: repair MapActivity compile errors'
          git push origin "$BRANCH"

      - name: Remove temporary workflow from main
        if: success()
        run: |
          git switch main
          git rm .github/workflows/one-shot-mapactivity-repair.yml
          git config user.name 'DriveMate AI'
          git config user.email 'ghadir.baraty@gmail.com'
          git commit -m 'chore: remove one-shot MapActivity compile repair workflow'
          git push origin main
