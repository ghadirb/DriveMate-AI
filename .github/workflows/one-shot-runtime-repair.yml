name: one-shot runtime repair

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[runtime-repair]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch background navigation lifecycle
        run: python3 tools/one_shot_runtime_repair.py
      - name: Commit source fixes
        run: |
          git config user.name "DriveMate AI"
          git config user.email "ghadir.baraty@gmail.com"
          git add app/src/main/java/ai/drivemate/MainActivity.java app/src/main/java/ai/drivemate/NavigationForegroundService.java
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore background navigation and runtime voice session [runtime-repair]"
          git push
